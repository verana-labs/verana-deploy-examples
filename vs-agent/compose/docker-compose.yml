# VS Agent on one host: the agent, its PostgreSQL database and Redis.
# TLS and the public hostname are terminated by Caddy in front (see Caddyfile).
# Copy .env.example to .env and fill it in before `docker compose up -d`.
services:
  vs-agent:
    image: veranalabs/vs-agent:${VS_AGENT_VERSION:-2.0.0}
    restart: unless-stopped
    env_file: .env
    environment:
      PUBLIC_API_PORT: "3001"
      ADMIN_API_PORT: "3000"
      POSTGRES_HOST: postgres
      POSTGRES_USER: vsagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      REDIS_URL: redis://redis:6379
      # The admin API is reached only from this host; never publish port 3000.
      ADMIN_API_TRUSTED_NETWORKS: 127.0.0.0/8,::1/128,172.16.0.0/12
    volumes:
      - agent-data:/root/.afj
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vsagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: vsagent
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vsagent"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      - vs-agent

volumes:
  agent-data:
  postgres-data:
  redis-data:
  caddy-data:
